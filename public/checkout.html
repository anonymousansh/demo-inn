<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Demo Inn</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f6fb;
        color: #1d2433;
      }
      .container {
        max-width: 980px;
        margin: 60px auto;
        background: white;
        border-radius: 22px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.1);
        padding: 30px;
      }
      h1 { margin-top: 0; }
      .details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .box {
        background: #f8fafc;
        border-radius: 16px;
        padding: 18px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }
      input, button {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #dfe7f1;
        margin-bottom: 12px;
      }
      button {
        background: #f5b700;
        border: none;
        font-weight: 700;
        cursor: pointer;
      }
      .summary {
        background: #0f172a;
        color: white;
        padding: 20px;
        border-radius: 18px;
      }
      .back-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #1d4ed8;
        font-weight: 600;
      }
      .message {
        min-height: 20px;
        color: #b91c1c;
        font-weight: 600;
      }
      .success {
        color: #166534;
      }
      @media (max-width: 760px) {
        .details { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a class="back-link" href="/">← Back to Demo Inn</a>
      <h1>Checkout</h1>
      <div class="details">
        <div class="box">
          <h3>Guest Details</h3>
          <form id="checkoutForm">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your name" required />

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="demo@gmail.com" required />

            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="XXXXXXXX43" required />
            <p class="message" id="checkoutMessage"></p>
            <button type="submit" id="payButton">Confirm Booking</button>
          </form>
        </div>

        <div class="summary">
          <h3>Booking Summary</h3>
          <p id="summaryRoom">Room: -</p>
          <p id="summaryDate">Dates: -</p>
          <p id="summaryTotal">Total: ₹0</p>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';
      const roomId = params.get('roomId');
      const roomName = params.get('roomName');
      const roomPrice = Number(params.get('roomPrice') || 0);
      const checkIn = params.get('checkIn');
      const checkOut = params.get('checkOut');
      const guests = params.get('guests');
      const guestDraft = JSON.parse(sessionStorage.getItem('demoInnBookingGuest') || '{}');
      const checkoutMessage = document.getElementById('checkoutMessage');

      if (!roomId || !checkIn || !checkOut || !roomPrice) {
        checkoutMessage.textContent = 'This checkout link is incomplete. Please start again from the booking form.';
        document.getElementById('payButton').disabled = true;
      }

      const nights = Math.max(1, Math.ceil((new Date(checkOut) - new Date(checkIn)) / (1000 * 60 * 60 * 24)));
      const total = roomPrice * nights;

      document.getElementById('summaryRoom').textContent = `Room: ${roomName}`;
      document.getElementById('summaryDate').textContent = `Dates: ${checkIn} to ${checkOut} (${nights} nights)`;
      document.getElementById('summaryTotal').textContent = `Total: ₹${total}`;
      document.getElementById('name').value = guestDraft.name || '';
      document.getElementById('email').value = guestDraft.email || '';
      document.getElementById('phone').value = guestDraft.phone || '';

      document.getElementById('checkoutForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = document.getElementById('checkoutMessage');
        const button = document.getElementById('payButton');
        message.textContent = '';
        button.disabled = true;
        button.textContent = 'Saving booking...';

        const payload = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          roomId,
          roomName,
          checkIn,
          checkOut,
          guests,
          amount: roomPrice,
          total,
          paymentStatus: 'Pending'
        };

        try {
          const res = await fetch(`${API_BASE}/api/bookings`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await res.json();
          if (!res.ok) throw new Error(result.message || 'Booking could not be saved.');
          sessionStorage.removeItem('demoInnBookingGuest');
          message.classList.add('success');
          message.textContent = 'Booking confirmed and saved. View it in the admin dashboard.';
          button.textContent = 'Booking Confirmed';
          button.disabled = true;
          const adminLink = document.createElement('a');
          adminLink.href = '/admin';
          adminLink.textContent = 'Open admin dashboard';
          message.appendChild(document.createElement('br'));
          message.appendChild(adminLink);
        } catch (error) {
          message.textContent = error.message;
          button.disabled = false;
          button.textContent = 'Confirm Booking';
        }
      });
    </script>
  </body>
</html>
