<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Inn Admin Dashboard</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1d2433;
      }
      .container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 { margin-bottom: 20px; }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }
      .toolbar a { color: #1d4ed8; font-weight: 600; }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-bottom: 24px;
      }
      .stat {
        background: white;
        padding: 22px;
        border-radius: 18px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 16px;
        overflow: hidden;
      }
      th, td {
        border-bottom: 1px solid #edf2f7;
        padding: 14px 12px;
        text-align: left;
      }
      th {
        background: #0f172a;
        color: white;
      }
      .badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .paid { background: #dcfce7; color: #166534; }
      .pending { background: #fef3c7; color: #92400e; }
      .confirmed { background: #dbeafe; color: #1e40af; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="toolbar">
        <h1>Demo Inn Admin Dashboard</h1>
        <a href="/">View website</a>
      </div>
      <div class="stats">
        <div class="stat"><h3>Total Bookings</h3><p id="totalBookings">0</p></div>
        <div class="stat"><h3>Paid</h3><p id="paidBookings">0</p></div>
        <div class="stat"><h3>Revenue</h3><p id="revenue">₹0</p></div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Guest</th>
            <th>Room</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Total</th>
            <th>Booking Status</th>
            <th>Payment</th>
          </tr>
        </thead>
        <tbody id="bookingRows"></tbody>
      </table>
    </div>

    <script>
      const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';

      async function loadAdminData() {
        const response = await fetch(`${API_BASE}/api/bookings`);
        if (!response.ok) throw new Error('Unable to load bookings.');
        const bookings = await response.json();
        const rows = document.getElementById('bookingRows');
        rows.innerHTML = '';
        let paidCount = 0;
        let revenue = 0;

        bookings.forEach((booking) => {
          if (booking.paymentStatus === 'Paid') paidCount++;
          revenue += Number(booking.total || 0);

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${booking.name}</td>
            <td>${booking.roomName}</td>
            <td>${booking.checkIn}</td>
            <td>${booking.checkOut}</td>
            <td>₹${booking.total}</td>
            <td><span class="badge confirmed">${booking.status || 'Confirmed'}</span></td>
            <td><span class="badge ${booking.paymentStatus === 'Paid' ? 'paid' : 'pending'}">${booking.paymentStatus || 'Pending'}</span></td>
          `;
          rows.appendChild(row);
        });

        document.getElementById('totalBookings').textContent = bookings.length;
        document.getElementById('paidBookings').textContent = paidCount;
        document.getElementById('revenue').textContent = `₹${revenue}`;
      }

      loadAdminData().catch((error) => {
        document.getElementById('bookingRows').innerHTML = `<tr><td colspan="7">${error.message}</td></tr>`;
      });
    </script>
  </body>
</html>
